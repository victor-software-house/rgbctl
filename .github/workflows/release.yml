name: Release

# verctl's reusable release workflow, on every push to main and on demand.
# It releases, from HEAD, each version HEAD holds whose release is incomplete:
# a draft GitHub Release with the static musl tarballs .ctl/ver.yaml declares,
# then the published Release, which creates the tag, with no registry upload
# (publisher: none). Then it opens or updates the Version PR on
# verctl/release/main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release run at a time. A newer run waits instead of cancelling one that
# may be publishing; it releases every incomplete version at HEAD, so the
# queued run covers what any skipped one would have. The "-caller" part keeps
# this group apart from the called workflow's own group.
concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    permissions:
      contents: write # tags, Releases, assets, and verctl/release/main without the App
      pull-requests: write # the Version PR without the App
      id-token: write # the reusable workflow's publish job requests it
    uses: victor-software-house/verctl/.github/workflows/release.yml@3a213b0e1366e89275dc380e6dbecf5931f798a7 # v0.8.6-rc.4
    with:
      mise-version: 2026.11.6
      mise-env: ci
    # The App token opens the Version PR so that its CI starts; a PR opened
    # with GITHUB_TOKEN starts no workflow.
    secrets:
      app-client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
