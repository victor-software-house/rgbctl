name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# The shared Verify job reads this run and the runs that replaced it.
permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  # A draft run gets a group of its own, so it never cancels the ready run.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !github.event.pull_request.draft }}
    uses: victor-software-house/actions/.github/workflows/rust-ci.yml@c5ea40a355cb9e5ae9429827ccc1048d333c23b1 # main, 2026-11-09
    with:
      mise-version: 2026.11.1
      advisories: true
      semver: false
      timeout-minutes: 8
      build-runner: '["ubuntu-latest"]'
      read-only-runner: '["ubuntu-latest"]'
      light-runner: ubuntu-latest
      cache-volume: false
    secrets:
      release-mirror-token: ${{ secrets.RELEASE_MIRROR_TOKEN }}
