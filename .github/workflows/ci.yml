name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# The shared Verify job reads this run and the runs that replaced it.
permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  # A draft run gets a group of its own, so it never cancels the ready run.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !github.event.pull_request.draft }}
    # The shared jobs that install tools trade the job's OIDC token for a
    # release mirror session token.
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    uses: victor-software-house/actions/.github/workflows/rust-ci.yml@d6ce82bb1fe3a3bac6c68619c603993c08990d64 # main, 2026-11-09
    with:
      mise-version: 2026.11.1
      advisories: true
      semver: false
      timeout-minutes: 8
      build-runner: '["ubuntu-latest"]'
      read-only-runner: '["ubuntu-latest"]'
      light-runner: ubuntu-latest
      cache-volume: false
